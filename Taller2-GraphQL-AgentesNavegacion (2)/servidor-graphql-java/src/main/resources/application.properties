spring.application.name=SistemaAgentesGraphQL

# Puerto del servidor. 0.0.0.0 permite que clientes de OTROS equipos de la red se conecten.
server.port=8081
server.address=0.0.0.0

# Endpoint GraphQL y consola GraphiQL (http://localhost:8081/graphiql) para pruebas
spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=true
